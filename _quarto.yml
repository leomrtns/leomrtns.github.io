project:
  type: website
  output-dir: _site
  render:
    - index.md
    - projects/index.md
    - about/index.md
    - publications/index.md
    - blog/index.md
    - posts/**/*.md
    - posts/**/*.qmd
    - posts/**/*.ipynb
    - doxygen/index.md
    - 404.md
  resources:
    - assets/
    - doxygen-biomcmclib/
    - SpecImage/
  pre-render:
    - python3 scripts/update-publications.py
  post-render:
    - python3 scripts/post-render.py
website:
  title: Leo Martins
  site-url: https://leomrtns.github.io
  description: Computational biology, evolutionary genomics, and notes from the workbench.
  favicon: assets/design/favicon.svg
  search:
    location: navbar
    type: overlay
  navbar:
    background: light
    title: 'Leo Martins<span class="brand-dot">.</span>'
    left:
      - text: Projects
        href: projects/index.md
      - text: Blog
        href: blog/index.md
      - text: Publications
        href: publications/index.md
      - text: About
        href: about/index.md
    right:
      - icon: github
        href: https://github.com/leomrtns
        aria-label: GitHub
  page-footer:
    left: 'Leo Martins · Computational biology & evolutionary genomics'
    right:
      - text: '<i class="bi bi-globe" aria-hidden="true"></i> Website'
        href: https://www.liverpool.ac.uk/people/leonardo-de-oliveira-martins
      - text: '<i class="bi bi-envelope-fill" aria-hidden="true"></i> Email'
        href: mailto:leomrtns@gmail.com
      - text: '<i class="bi bi-github" aria-hidden="true"></i> GitHub'
        href: https://github.com/leomrtns
      - text: '<i class="bi bi-mastodon" aria-hidden="true"></i> Mastodon'
        href: https://mstdn.science/@leomrtns
        rel: me
      - text: '<i class="bi bi-bluesky" aria-hidden="true"></i> Bluesky'
        href: https://bsky.app/profile/leomrtns.bsky.social
      - text: '<i class="bi bi-linkedin" aria-hidden="true"></i> LinkedIn'
        href: https://www.linkedin.com/in/leomrtns
      - text: '<i class="bi bi-rss-fill" aria-hidden="true"></i> RSS'
        href: blog/index.xml
  draft-mode: gone
format:
  html:
    theme: [cosmo, assets/design/theme.scss]
    toc: true
    toc-title: On this page
    code-copy: true
    code-overflow: scroll
    highlight-style: github
    html-math-method: mathjax
    lang: en-GB
    date-format: D MMMM YYYY
    link-external-newwindow: true
    smooth-scroll: true
execute:
  enabled: false
  freeze: true
